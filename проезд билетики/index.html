<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миколаївелектротранс</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="container">


    <div class="tabs">
      <button class="active">Квиток</button>
      <button>Проїзний</button>
    </div>

    <div class="price-block">
      <p>Вартість покупки</p>
      <h2 id="totalPrice">8 ₴</h2>
    </div>

    <div class="counter">
      <button class="oke" id="minus">–</button>
      <span id="ticketCount">1</span>
      <button class="oke1" id="plus">+</button>
    </div>
    <div class="line">
    <button id="monoPay" class="mono">mono Pay</button>
    </div>
  </div>

  

  <script src="../js/index.js"></script>
</body>
</html>
